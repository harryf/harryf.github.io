<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masha's Mac</title>
<meta name="description" content="A course in ten modules: from the Mac keyboard to the Terminal, Claude Code, myos and owning your own app.">
<meta name="theme-color" content="#1D5C8A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Masha's Mac">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F1; --bg-2:#F1ECE2; --surface:#FFFFFF; --ink:#172230; --muted:#5A6572; --line:#E3DCCF;
  --lake:#1D5C8A; --lake-ink:#FFFFFF; --lake-soft:#E3EEF7;
  --sign:#F6C445; --sign-ink:#2B2200; --sign-soft:#FBEFC6;
  --pine:#2F6B4F; --pine-soft:#E1F0E7;
  --coral:#AD3F28; --coral-soft:#FBE4DE;
  --code-bg:#1B2430; --code-ink:#E6EDF3;
  --shadow:0 1px 2px rgba(23,34,48,.05),0 10px 30px rgba(23,34,48,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1621; --bg-2:#141E2B; --surface:#182331; --ink:#E9EEF3; --muted:#A3AEBA; --line:#27333F;
    --lake:#7CB9E8; --lake-ink:#08131C; --lake-soft:#1C2E40;
    --sign:#F6C445; --sign-ink:#2B2200; --sign-soft:#3A3116;
    --pine:#7CC29A; --pine-soft:#173226;
    --coral:#FF8F73; --coral-soft:#3B221B;
    --code-bg:#0A111A; --code-ink:#E6EDF3;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1621; --bg-2:#141E2B; --surface:#182331; --ink:#E9EEF3; --muted:#A3AEBA; --line:#27333F;
  --lake:#7CB9E8; --lake-ink:#08131C; --lake-soft:#1C2E40;
  --sign:#F6C445; --sign-ink:#2B2200; --sign-soft:#3A3116;
  --pine:#7CC29A; --pine-soft:#173226;
  --coral:#FF8F73; --coral-soft:#3B221B;
  --code-bg:#0A111A; --code-ink:#E6EDF3;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.12;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,5vw,2.8rem)}
h2{font-size:clamp(1.4rem,3vw,1.9rem)}
h3{font-size:1.08rem;font-weight:700;margin:22px 0 8px}
p{margin:0 0 .9em}
a{color:var(--lake)}
code,kbd,pre{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
code{background:var(--bg-2);border-radius:6px;padding:1px 6px;font-size:.9em}
kbd{display:inline-block;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:.84em;line-height:1.6;white-space:nowrap}
pre{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:14px 16px;overflow:auto;font-size:.9rem;line-height:1.5;margin:0 0 14px}
pre code{background:none;padding:0;font-size:inherit;color:inherit}
pre .copy{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:4px 10px;font:600 .76rem Inter,system-ui,sans-serif;cursor:pointer}
pre .copy:hover{background:rgba(255,255,255,.22)}
pre .copy.ok{background:var(--pine);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.narrow{max-width:820px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.top .brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.top nav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.top nav::-webkit-scrollbar{display:none}
.top nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.86rem;padding:6px 10px;border-radius:999px;white-space:nowrap}
.top nav a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.xpbar{width:100%;display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);padding:2px 0 4px}
.xpbar .lvl{font-weight:700;color:var(--ink);white-space:nowrap}
.xpbar .bar{flex:1;height:8px;background:var(--bg-2);border-radius:999px;overflow:hidden}
.xpbar .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--lake),var(--pine));border-radius:999px;transition:width .5s ease}
.xpbar .n{white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;line-height:1.2}
.btn.primary{background:var(--lake);color:var(--lake-ink);border-color:transparent}
.btn.good{background:var(--pine);color:#fff;border-color:transparent}
.btn.warn{background:var(--coral);color:#fff;border-color:transparent}
.btn.quiet{background:transparent}
.btn.small{padding:5px 12px;font-size:.8rem;min-height:32px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--sign);outline-offset:2px}
.screen{display:none;padding:28px 0 72px}
.screen.active{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.lede{font-size:1.08rem;max-width:62ch}
.muted{color:var(--muted)} .small{font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:18px 0}
.mod{display:block;text-decoration:none;color:inherit;position:relative;transition:transform .15s ease,border-color .15s ease}
.mod:hover{transform:translateY(-2px);border-color:var(--lake)}
.mod .em{font-size:1.8rem;line-height:1}
.mod h3{margin:8px 0 4px;font-family:Fraunces,Georgia,serif;font-size:1.25rem}
.mod .blurb{color:var(--muted);font-size:.92rem;margin:0 0 10px;min-height:2.8em}
.mod .meta{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted)}
.mod .meta .bar{flex:1;height:6px;background:var(--bg-2);border-radius:999px;overflow:hidden}
.mod .meta .bar span{display:block;height:100%;background:var(--pine);border-radius:999px}
.mod .num{position:absolute;top:14px;right:16px;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.1rem;color:var(--muted)}
.mod.done{border-color:var(--pine)}
.mod .badge{position:absolute;top:12px;right:14px;background:var(--pine-soft);color:var(--pine);font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 9px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap;vertical-align:middle}
.pill.ok{background:var(--pine-soft);color:var(--pine)}
.pill.todo{background:var(--bg-2);color:var(--muted)}
.pill.sign{background:var(--sign-soft);color:var(--sign-ink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pill.sign{color:var(--sign)} }
:root[data-theme="dark"] .pill.sign{color:var(--sign)}
.tip{border-left:4px solid var(--sign);background:var(--sign-soft);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.tip .t{font-weight:700;margin-bottom:2px}
.tip p{margin:0}
.callout{border-left:4px solid var(--lake);background:var(--lake-soft);border-radius:10px;padding:10px 14px;margin:12px 0}
.callout p{margin:0}
.lesson-list{list-style:none;margin:0;padding:0}
.lesson-list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.lesson-list li:last-child{border-bottom:0}
.lesson-list a{text-decoration:none;color:var(--ink);font-weight:600;flex:1}
.lesson-list .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--bg-2);color:var(--muted);flex:none}
.lesson-list .st.ok{background:var(--pine-soft);color:var(--pine)}
.lesson-list .min{color:var(--muted);font-size:.82rem;white-space:nowrap}
.body table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:.92rem}
.body th,.body td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.body th{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.body ul,.body ol{padding-left:22px;margin:0 0 14px}
.body li{margin:3px 0}
.body .tbl{overflow-x:auto;margin:0 0 14px}
.body .tbl table{margin:0;min-width:420px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:28px;flex-wrap:wrap}
.navrow .spacer{flex:1}
/* quiz */
.q .num{font-size:.78rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.q h3{margin:6px 0 14px;font-size:1.15rem}
.opts{display:grid;gap:8px;margin:0 0 12px}
.opt{text-align:left;background:var(--bg-2);border:2px solid transparent;border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-weight:700;color:var(--muted);flex:none}
.opt:hover{border-color:var(--lake)}
.opt.right{background:var(--pine-soft);border-color:var(--pine)}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin:0 0 12px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--pine-soft)} .fb.no{background:var(--coral-soft)}
.fb .h{font-weight:700;margin-bottom:2px}
.score{font-family:Fraunces,Georgia,serif;font-size:2.4rem;font-weight:700;line-height:1}
textarea.proof,input.proof{font:inherit;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.9rem;color:var(--ink);background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea.proof{min-height:120px;resize:vertical}
.state{font-size:.88rem;min-height:1.3em;margin:8px 0}
.state.ok{color:var(--pine);font-weight:600} .state.no{color:var(--coral)}
label.check{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;margin:10px 0}
label.check input{width:22px;height:22px}
/* sandbox */
.term{background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:14px 16px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.9rem;line-height:1.5;min-height:360px;max-height:60vh;overflow:auto;box-shadow:var(--shadow)}
.term .out{white-space:pre-wrap;word-break:break-word;margin:0}
.term .err{color:#FF8F73}
.term .ps{color:#7CC29A}
.term .cmd{color:#fff}
.term form{display:flex;gap:8px;align-items:center;margin-top:4px}
.term input{flex:1;background:transparent;border:0;color:#fff;font:inherit;outline:none;padding:0;min-width:0}
.term input::placeholder{color:#5A6572}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tasks li{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.tasks li .st{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--muted)}
.tasks li.ok .st{background:var(--pine-soft);color:var(--pine)}
.tasks li.ok{color:var(--muted);text-decoration:line-through}
/* progress */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 20px}
.bdg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.bdg .em{font-size:2rem;filter:grayscale(1);opacity:.35}
.bdg.on .em{filter:none;opacity:1}
.bdg .n{font-weight:700;font-size:.86rem;margin-top:4px}
.bdg .m{font-size:.76rem;color:var(--muted)}
.levels{display:grid;gap:4px;font-size:.9rem}
.levels div{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px}
.levels div.now{background:var(--lake-soft);font-weight:700}
.levels div.past{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.cheat table{border-collapse:collapse;width:100%;font-size:.9rem}
.cheat th,.cheat td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.cheat code{white-space:normal}
.two > *{min-width:0}
.cheat th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:all .3s ease;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.continue{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
footer{color:var(--muted);font-size:.82rem;padding:24px 0 40px;text-align:center}
@media (max-width:600px){
  .top .brand{font-size:.98rem}
  .screen{padding:20px 0 60px}
  pre{font-size:.82rem;padding:12px 12px}
  .mod .blurb{min-height:0}
}
@media (prefers-reduced-motion: reduce){ .screen.active{animation:none} .mod:hover{transform:none} html{scroll-behavior:auto} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">🍎 Masha's Mac</a>
    <nav>
      <a href="#home" data-nav="home">Modules</a>
      <a href="#sandbox" data-nav="sandbox">Sandbox</a>
      <a href="#cheatsheet" data-nav="cheatsheet">Cheat sheet</a>
      <a href="#progress" data-nav="progress">Progress</a>
    </nav>
    <div class="xpbar"><span class="lvl" id="lvl"></span><div class="bar"><span id="xpfill"></span></div><span class="n" id="xpn"></span></div>
  </div>
</header>

<main class="wrap" id="main"></main>
<footer>Made for Masha by Harry, with myos. Progress stays in this browser. <a href="#progress">Export it</a> before you switch.</footer>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script src="content.js"></script>
<script src="sandbox.js"></script>
<script>
(function(){
  const C = window.CONTENT;
  const KEY = 'masha-osx.v1';
  const $ = (s, el) => (el || document).querySelector(s);
  const main = $('#main');

  // ───────────────────────── state
  const fresh = () => ({ v: 1, lessons: {}, quiz: {}, challenges: {}, tipOffset: 0, lastHash: '', celebrated: {} });
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
    return fresh();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  let S = load();

  // XP is derived, never stored: no farming, no drift.
  function xp() {
    let n = Object.keys(S.lessons).length * C.xp.lesson;
    for (const m of Object.values(S.quiz)) n += Object.keys(m.correct || {}).length * C.xp.answer;
    n += Object.keys(S.challenges).length * C.xp.challenge;
    return n;
  }
  function level(n) {
    let cur = C.levels[0], next = null;
    for (let i = 0; i < C.levels.length; i++) { if (n >= C.levels[i].xp) cur = C.levels[i]; else { next = C.levels[i]; break; } }
    return { cur, next };
  }
  function moduleStats(m) {
    const lessons = m.lessons.filter((l) => S.lessons[m.id + '/' + l.id]).length;
    const quizDone = m.quiz.length === 0 || (S.quiz[m.id] && S.quiz[m.id].done);
    const chDone = !!S.challenges[m.id];
    const total = m.lessons.length + (m.quiz.length ? 1 : 0) + 1;
    const done = lessons + (m.quiz.length && quizDone ? 1 : 0) + (chDone ? 1 : 0);
    return { lessons, quizDone, chDone, total, done, complete: done === total };
  }
  function renderXp() {
    const n = xp(); const { cur, next } = level(n);
    $('#lvl').textContent = cur.name;
    const base = cur.xp, top = next ? next.xp : cur.xp + 1;
    const pct = next ? Math.min(100, Math.round(((n - base) / (top - base)) * 100)) : 100;
    $('#xpfill').style.width = pct + '%';
    $('#xpn').textContent = next ? `${n} XP · ${next.xp - n} to ${next.name}` : `${n} XP · top level`;
  }

  // ───────────────────────── mini markdown
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function inline(s) {
    s = esc(s);
    s = s.replace(/\[\[([\s\S]+?)\]\]/g, (_, c) => `<code>${c}</code>`);
    s = s.replace(/\{\{([^}]+)\}\}/g, (_, k) => `<kbd>${k}</kbd>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function md(src) {
    const lines = src.split('\n'); const out = []; let i = 0;
    const flushPara = (buf) => { if (buf.length) { out.push(`<p>${inline(buf.join(' '))}</p>`); buf.length = 0; } };
    let para = [];
    while (i < lines.length) {
      const ln = lines[i];
      if (ln.startsWith('~~~')) {
        flushPara(para); const code = []; i++;
        while (i < lines.length && !lines[i].startsWith('~~~')) { code.push(lines[i]); i++; }
        i++;
        out.push(`<pre><button class="copy" type="button" data-copy>Copy</button><code>${esc(code.join('\n'))}</code></pre>`);
        continue;
      }
      if (ln.startsWith('## ')) { flushPara(para); out.push(`<h3>${inline(ln.slice(3))}</h3>`); i++; continue; }
      if (ln.startsWith('> ')) {
        flushPara(para); const q = [];
        while (i < lines.length && lines[i].startsWith('> ')) { q.push(lines[i].slice(2)); i++; }
        out.push(`<div class="callout"><p>${inline(q.join(' '))}</p></div>`); continue;
      }
      if (ln.startsWith('|')) {
        flushPara(para); const rows = [];
        while (i < lines.length && lines[i].startsWith('|')) { rows.push(lines[i]); i++; }
        const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const head = cells(rows[0]); const body = rows.slice(1).filter((r) => !/^\|[\s-|]+\|$/.test(r));
        out.push('<div class="tbl"><table><thead><tr>' + head.map((h) => `<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>' +
          body.map((r) => '<tr>' + cells(r).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
        continue;
      }
      if (/^- /.test(ln)) {
        flushPara(para); const items = [];
        while (i < lines.length && /^- /.test(lines[i])) { items.push(lines[i].slice(2)); i++; }
        out.push('<ul>' + items.map((x) => `<li>${inline(x)}</li>`).join('') + '</ul>'); continue;
      }
      if (/^\d+\. /.test(ln)) {
        flushPara(para); const items = [];
        while (i < lines.length && /^\d+\. /.test(lines[i])) { items.push(lines[i].replace(/^\d+\. /, '')); i++; }
        out.push('<ol>' + items.map((x) => `<li>${inline(x)}</li>`).join('') + '</ol>'); continue;
      }
      if (ln.trim() === '') { flushPara(para); i++; continue; }
      para.push(ln); i++;
    }
    flushPara(para);
    return out.join('\n');
  }

  // ───────────────────────── routing
  function parse(hash) {
    const h = (hash || '').replace(/^#/, '');
    if (!h || h === 'home') return { screen: 'home' };

    }

  function quiz(sec, { mod }) {

    const cheer = ['Yes!', 'Exactly.', 'That is it.', 'Nice.', 'You have got this.', 'Spot on.'];
    const oops = ['Not quite.', 'Close, but no.', 'Nope, here is why.', 'Other one.'];

        save(); renderXp();

          <p><button class="btn" type="button" id="exp">Export (copy and download)</button></p>
          <p><textarea class="proof" id="imp" placeholder="paste an exported progress file here" aria-label="import"></textarea></p>
          <p><button class="btn" type="button" id="impb">Import</button> <span class="state" id="impst" style="display:inline"></span></p>
          <p style="margin-top:18px"><button class="btn warn small" type="button" id="reset">Reset everything</button></p>
        </div>
      </div>`;
    $('#exp', sec).addEventListener('click', async () => {
      const text = JSON.stringify(S, null, 2);
      try { await navigator.clipboard.writeText(text); } catch (e) {}
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = `masha-mac-progress-${new Date().toISOString().slice(0, 10)}.json`; a.click();
      toast('Copied to the clipboard and downloaded.');
    });
    $('#impb', sec).addEventListener('click', () => {
      const st = $('#impst', sec);
      try { const obj = JSON.parse($('#imp', sec).value); if (obj && obj.v === 1 && obj.lessons) { S = Object.assign(fresh(), obj); save(); st.className = 'state ok'; st.textContent = 'Imported.'; render(); } else throw new Error('shape'); }
      catch (e) { st.className = 'state no'; st.textContent = 'That is not a progress file from this page.'; }
    });
    $('#reset', sec).addEventListener('click', () => { if (confirm('Delete all progress on this browser? Export first if you want to keep it.')) { S = fresh(); save(); render(); } });
  }

  // ───────────────────────── helpers
  function wireCopy(root) {
    root.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
      const text = b.parentElement.querySelector('code').textContent;
      try { await navigator.clipboard.writeText(text); b.textContent = 'Copied'; b.classList.add('ok'); } catch (e) { b.textContent = 'Select and Cmd+C'; }
      setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('ok'); }, 1600);
    }));
  }
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
  function checkBadge(mod) {
    if (moduleStats(mod).complete && !S.celebrated[mod.id]) { S.celebrated[mod.id] = Date.now(); save(); confetti(160); setTimeout(() => toast(`🏅 Badge earned: ${mod.badge}`), 300); }
  }
  function confetti(count) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = $('#confetti'); const ctx = cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight;
    const cols = ['#F6C445', '#1D5C8A', '#2F6B4F', '#AD3F28', '#7CB9E8'];
    const ps = Array.from({ length: count }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 3, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6 }));
    let t = 0;
    (function frame() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (const p of ps) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); }
      if (++t < 110) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
    })();
  }
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input,textarea')) return;
    const r = parse(location.hash);
    if (r.screen !== 'lesson') return;
    const k = r.mod.lessons.indexOf(r.lesson);
    if (e.key === 'ArrowRight' && k < r.mod.lessons.length - 1) go(`#${r.mod.id}/${r.mod.lessons[k + 1].id}`);
    if (e.key === 'ArrowLeft' && k > 0) go(`#${r.mod.id}/${r.mod.lessons[k - 1].id}`);
  });

  // service worker: only over http(s); a file:// open or a failed registration changes nothing.
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('New version ready. Reload when you like.'); }); });
    }).catch(() => {});
  }

  render();
})();
</script>
</body>
