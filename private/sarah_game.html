/* ---------- Grist client: upserts through a local queue, never blocks the visit ---------- */
const GRIST = "https://docs.getgrist.com/api/docs/io7cKbM6Bu4k";
const grist = {
  queue: store.get("queue", []),
  busy:false, retryAt:0,
  put(table, key, fields){
    if(isPrivate()) return;
    const require = {}; require[Object.keys(key)[0]] = Object.values(key)[0];
    this.queue.push({ path:`/tables/${table}/records?onmany=all`, body:{ records:[{ require, fields }] } });
    if(this.queue.length > 200) this.queue = this.queue.slice(-200);
    store.set("queue", this.queue); this.drain();
  },
  async drain(){
    if(isPrivate()){ if(this.queue.length){ this.queue = []; store.set("queue", this.queue); } return; }
    if(this.busy || !this.queue.length || Date.now() < this.retryAt) return;
    this.busy = true;
    const job = this.queue[0];
    try{
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(GRIST + job.path, { method:"PUT", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(job.body), signal:ctl.signal });
      clearTimeout(t);
      if(r.ok){ this.queue.shift(); store.set("queue", this.queue); this.retryAt = 0; }
      else if(r.status >= 400 && r.status < 500){ console.error("grist refused, dropping", r.status, job.path); this.queue.shift(); store.set("queue", this.queue); this.retryAt = 0; }
      else { this.retryAt = Date.now() + 30000; }
    }catch(e){ this.retryAt = Date.now() + 20000; }
    this.busy = false;
    if(this.queue.length && Date.now() >= this.retryAt) setTimeout(() => this.drain(), 300);
  },
  async get(table, params){
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 10000);
    try{
      const r = await fetch(GRIST + `/tables/${table}/records` + (params ? "?" + params : ""), { signal:ctl.signal });
      clearTimeout(t); if(!r.ok) return null; return (await r.json()).records || [];
    }catch(e){ clearTimeout(t); return null; }
  }
};

/* ---------- the visit engine ---------- */
function draw(mood, history, seed, opts){
  const rnd = mulberry(seed);
  const n = 3 + Math.floor(rnd() * 3);
  const recent = new Set([].concat(...history.slice(-3).map(h => h.cards || [])));
  const band = !mood ? 1 : mood <= 2 ? 0 : mood >= 4 ? 2 : 1;
  const pool = DECK.filter(c => !(c.once && (opts||{})[c.once]));
  const weight = c => c.w[band] * (recent.has(c.id) ? 0.25 : 1);
  const chosen = [];
  const take = filter => {
    const cands = pool.filter(c => !chosen.includes(c) && (!filter || filter(c)));
    if(!cands.length) return;
    let total = cands.reduce((s, c) => s + weight(c), 0), r = rnd() * total;
    for(const c of cands){ r -= weight(c); if(r <= 0){ chosen.push(c); return; } }
    chosen.push(cands[cands.length - 1]);
  };
  take(c => c.gives); take(c => c.quiet);
  while(chosen.length < n) take();
  // naming the bear comes early, once, and only if it was drawn
  return chosen.map(c => c.id);
}

function startVisit(cards, soft){
  const history = store.get("history", []);
  const count = store.get("count", 0) + 1; store.set("count", count);
  const colour = visit && visit.colour || store.get("lastColour", "peche");
  const mood = visit ? visit.mood : null;
  const name = visit ? visit.name : "";
  const list = cards || draw(mood, history, Date.now() ^ (count * 2654435761), { bearName: !!bearName });
  visit = { id: uid(), colour, mood, name, weather:null, cards:list, i:0, encore:false, soft:!!soft, entries:[] };
  grist.put("Visits", { VisitId: visit.id }, { Colour: colour, Mood: mood || null, Cards: list.join(","), Device: device });
  renderCard();
}

function endVisit(){
  if(!visit) return show("s-home");
  const history = store.get("history", []);
  history.push({ at: Date.now(), cards: visit.cards, colour: visit.colour, mood: visit.mood });
  store.set("history", history.slice(-30));
  grist.put("Visits", { VisitId: visit.id }, { Cards: visit.cards.join(","), Weather: visit.weather || "", Mood: visit.mood || null });
  stopAudio();
  renderEnd();
}

function saveEntry(kind, text, extra){
  if(!text || !text.trim()) return;
  const e = { id: uid(), kind, text: text.trim(), extra: extra || "", at: Date.now(), visit: visit ? visit.id : "" };
  const entries = store.get("entries", []); entries.push(e);
  if(!store.set("entries", entries.slice(-500))){ if(visit) visit.entries.push(e); const warn = document.querySelector("#s-card .card .body"); if(warn) warn.append(el("p", { class:"quiet" }, "Le téléphone n'a pas pu garder ça. Ce n'est pas grave, c'est dit.")); }
  if(settings.share) grist.put("Entries", { EntryId: e.id }, { VisitId: e.visit, Kind: kind, Text: e.text, Extra: e.extra, Device: device });
  return e;
}

    const b = el("button", { class:"btn", type:"button" }, "🍪 un poro-snack");
    b.addEventListener("click", () => { if(n >= 5) return; n++; drawPoro(); msg.textContent = ["Miam.","Il fait un petit bruit content.","Il est un peu plus rond.","Il te regarde avec amour.","Il est content. C'est tout ce qu'il voulait."][n-1]; if(n >= 5){ b.disabled = true; b.textContent = "il est plein"; } });
    body.append(wrap, msg, el("div", { class:"center" }, b));
  },
  gg(body, card){
    body.append(el("p", {}, "Une chose que tu as faite aujourd'hui. Même minuscule. Surtout minuscule."));
    const chips = el("div", { class:"chips" }); const inp = el("textarea", { placeholder:"ou autre chose", rows:"2" }); const stamp = el("div", { class:"center" });
    GG_CHIPS.forEach(t => { const b = el("button", { class:"chip", type:"button" }, t); b.addEventListener("click", () => { inp.value = inp.value.trim() ? inp.value.trim() + ", " + t : t; stamp.innerHTML = '<span class="stamp">GG</span>'; }); chips.append(b); });
    inp.addEventListener("input", () => { stamp.innerHTML = inp.value.trim() ? '<span class="stamp">GG</span>' : ""; });
    body.append(chips, inp, stamp);
    card._commit = () => saveEntry("gg", inp.value);
  },
  doux(body, card){
    const st = el("div", { class:"sticker" }, pick(SOFT));
    body.append(el("p", { class:"quiet" }, "Un mot à garder pour aujourd'hui. Il ne demande rien."), el("div", { class:"center" }, st));
  },
  nana(body, card){
    const q = pick(QUOTES);
    body.append(el("p", { class:"hand", style:"font-size:26px" }, "« " + q[0] + " »"), el("p", { class:"quiet" }, q[1]));
  },
};

/* ---------- settings sheet and first note ---------- */
function renderSheet(){
  const p = $("#panel"); p.innerHTML = "";
  p.append(el("h2", {}, "Réglages"), el("p", { class:"quiet" }, "Tout ici est à toi. Rien ne bouge sans toi."));
  const sw = (label, get, set) => { const b = el("button", { type:"button", "aria-pressed": String(!!get()) }, get() ? "oui" : "non"); b.addEventListener("click", () => { set(!get()); b.setAttribute("aria-pressed", String(!!get())); b.textContent = get() ? "oui" : "non"; }); return el("div", { class:"switch" }, el("span", {}, label), b); };
  p.append(
    sw("Son", () => settings.sound, v => setSound(v)),
    sw("Moins de mouvement", () => settings.reduce, v => { settings.reduce = v; saveSettings(); document.body.classList.toggle("reduce", v); }),
    sw("Ne rien enregistrer aujourd'hui", () => isPrivate(), v => { settings.privateToday = v ? todayKey() : null; saveSettings(); }),
    sw("Garder mes mots aussi dans le carnet partagé", () => settings.share, v => { settings.share = v; saveSettings(); }),
    sw("Thème sombre", () => document.documentElement.getAttribute("data-theme") === "dark", v => { document.documentElement.setAttribute("data-theme", v ? "dark" : "light"); store.set("theme", v ? "dark" : "light"); }),
  );
  p.append(el("p", { class:"quiet", style:"margin-top:12px" }, "Ce qui part dans le carnet partagé (une feuille que Harry peut voir) : la couleur du jour, les cartes vues, la météo intérieure, le nom de l'ours, le coloriage. Tes mots restent sur cet appareil, sauf si tu allumes le réglage au-dessus."));
  const note = el("button", { class:"btn soft", type:"button" }, "Relire le mot de Harry"); note.addEventListener("click", () => { $("#sheet").classList.remove("on"); renderNote(); show("s-note"); });
  const close = el("button", { class:"btn primary", type:"button" }, "Fermer"); close.addEventListener("click", () => $("#sheet").classList.remove("on"));
  p.append(el("div", { class:"stack", style:"margin-top:14px" }, note, close), el("p", { class:"quiet", style:"margin-top:16px;font-family:var(--hand);font-size:18px" }, "Buy less, choose well, make it last. (V. W.)"));
}
function renderNote(){
  const s = $("#s-note"); s.innerHTML = "";
  s.append(el("div", { class:"hero", html: bearSvg() }), el("div", { class:"note" }, ...FIRST_NOTE.split(/(?<=\. )/).map(t => el("p", {}, t))));
  const b = el("button", { class:"btn primary", type:"button", style:"margin-top:14px" }, "D'accord");
  b.addEventListener("click", () => { store.set("noteSeen", true); renderHome(); show("s-home"); });
  s.append(el("div", { class:"center" }, b));
}

/* ---------- boot ---------- */
(function boot(){
  const theme = store.get("theme", null); if(theme) document.documentElement.setAttribute("data-theme", theme);
  if(settings.reduce) document.body.classList.add("reduce");
  $("#soundChip").addEventListener("click", () => setSound(!settings.sound));
  setSound(false); // sound is off at every open; her tap turns it on
  $("#settingsChip").addEventListener("click", () => { renderSheet(); $("#sheet").classList.add("on"); });
  $("#sheet").addEventListener("click", ev => { if(ev.target === $("#sheet")) $("#sheet").classList.remove("on"); });
  $("#brand").addEventListener("click", ev => { ev.preventDefault(); stopAudio(); visit = null; renderHome(); show("s-home"); });
  grist.get("Bear", "filter=" + encodeURIComponent(JSON.stringify({ Key:["bear"] }))).then(rows => { if(rows && rows.length && rows[0].fields.Name && !bearName){ bearName = rows[0].fields.Name; store.set("bearName", bearName); if($("#s-home").classList.contains("on")) renderHome(); } });
  addEventListener("focusin", ev => { if(ev.target.matches && ev.target.matches("textarea, input[type=text]")) setTimeout(() => ev.target.scrollIntoView({ block:"center", behavior:"smooth" }), 250); });
  grist.drain();
  if(!store.get("noteSeen", false)){ renderNote(); show("s-note"); } else { renderHome(); show("s-home"); }
  window.__terrier = { draw, DECK, COLOURS, store, settings, grist, get visit(){ return visit; }, startVisit, renderCard, setDay, bearSvg };
})();
</script>
